<style>

n-left:auto;display:flex;align-items:center;gap:8px}.pill,.icon{padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:white;color:#73748a;font-size:12px}.icon{width:38px;height:38px;padding:0;font-size:18px}.content{max-width:1150px;margin:auto;padding:31px 32px 60px}.hello{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--purple);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.hello h1{margin:0;font:800 29px Manrope;letter-spacing:-1px}.sub{color:var(--muted);margin:7px 0 0}.btn{padding:11px 15px;border:0;border-radius:11px;background:var(--purple);color:white;font-weight:700;box-shadow:0 6px 15px #5c60e52e}.soft{background:var(--lav);color:var(--purple);box-shadow:none}.hero{position:relative;overflow:hidden;min-height:210px;padding:30px 33px;border-radius:21px;color:#fff;background:linear-gradient(110deg,#575be0,#888af2);display:flex;align-items:center}.hero:after{content:'✳';position:absolute;right:6%;top:-65px;font-size:290px;color:#ffffff20}.hero div{position:relative;z-index:1}.hero small{font-weight:700;letter-spacing:1.5px}.hero h2{margin:12px 0;font:800 clamp(23px,3vw,32px)/1.2 Manrope}.hero p{margin:0 0 17px;color:#f2f2ff}.hero .btn{background:white;color:#565ae0;box-shadow:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 25px}.card,.stat,.meal,.recipe,.post{border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 30px #2727500b}.stat{padding:15px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:10px;font:800 24px Manrope}.stat small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.head h2{margin:0;font:700 16px Manrope}.link{border:0;background:none;color:var(--purple);font-weight:700}.two{display:grid;grid-template-columns:1.2f fr);gap:11px}.progress article{padding:16px;border-radius:13px;background:var(--lav)}.progress b{display:block;margin-top:8px;font:700 22px Manrope}.recipes{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.recipe{padding:15px}.recipe h3{font:700 13px Manrope}.recipe p{font-size:11px;line-height:1.5;color:var(--muted)}.post{overflow:hidden}.post-head,.caption{padding:12px 14px}.post-image{width:100%;max-height:440px;object-fit:cover}.hidden{display:none!important}.menu,.mobile-brand,.tabs,.backdrop,.close-drawer{display:none}.toast{position:fixed;z-index:60;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 15px;border-radius:11px;background:#292a45;color:white}dialog{width:min(500px,calc(100% - 24px));padding:0;border:0;border-radius:17px}dialog::backdrop{background:#19192d70}.mobile-brand{color:var(--ink);text-decoration:none;font:700 12px Manrope}.mobile-brand i{font-style:normal}

lumns:repeat(5,1fr);gap:3px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#ffffffef;backdrop-filter:blur(14px)}.tabs button{min-width:0;min-height:49px;border:0;border-radius:10px;background:transparent;color:#9293a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tabs button span{font:20px Manrope}.tabs button small{font-size:9px}.tabs button.active{background:var(--lav);color:var(--purple);font-weight:700}.toast{bottom:calc(75px + env(safe-area-inset-bottom))}}

</style></head><body>
<aside class="side" id="sidebar" aria-label="Main navigation"><a class="brand" href="#home"><i>✳</i>we can <b>do it</b></a><button class="close-drawer" data-close aria-label="Close menu">×</button><p class="label">YOUR SPACE</p><nav class="navs"><button class="nav active" data-page="home"><span>⌂</span>Home</button><button class="nav" data-page="diary"><span>♡</span>My diary</button><button class="nav" data-page="progress"><span>⌁</span>Progress</button><button class="nav" data-page="recipes"><span>♧</span>Recipe book <small>100</small></button></nav><p class="label" style="margin-top:25px">TOGETHER</p><nav class="navs"><button class="nav" data-page="community"><span>◉</span>What we did</button></nav><div class="push"></div><div class="quote"><i>✳</i><b>Small steps still<br>move you forward.</b><small>YOU'RE DOING GREAT</small></div><div class="profile">Your wellness journey</div></aside>
<main class="main"><header class="top"><button class="menu" id="menu" aria-label="Open navigation" aria-expanded="false">☰</button><a class="mobile-brand" href="#home"><i>✳</i>we can <b>do it</b></a><div class="crumb">Your space　/　<b id="crumb">Home</b></div><div class="right"><span class="pill" id="date"></span><button class="icon" id="settings" aria-label="Settings">⚙</button></div></header><div class="content" id="view"></div></main>
<button class="backdrop" id="backdrop" aria-label="Close navigation"></button><nav class="tabs" aria-label="Mobile navigation"><button class="active" data-page="home"><span>⌂</span><small>Home</small></button><button data-page="diary"><span>♡</span><small>Diary</small></button><button data-page="progress"><span>⌁</span><small>Progress</small></button><button data-page="recipes"><span>♧</span><small>Recipes</small></button><button data-page="community"><span>◉</span><small>Community</small></button></nav><div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<dialog id="mealDialog"><form id="mealForm" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font:700 18px Manrope">Add a meal</h2><button type="button" class="icon" data-dialog-close aria-label="Close">×</button></div><div class="fields"><div class="field"><label for="mealName">What did you eat?</label><input id="mealName" required placeholder="e.g. avocado toast"></div><div class="field"><label for="mealType">Meal</label><select id="mealType"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class="field"><label for="calories">Calories (kcal)</label><input id="calories" type="number" min="0" placeholder="350"></div><div class="field"><label for="photo">Food photo</label><input id="photo" type="file" accept="image/*"></div><div class="field full"><button class="btn">Save meal</button></div></div></form></dialog>
<script>
(()=>{'use strict';const KEY='we-can-do-it-diary',date=new Date(),today=()=>date.toISOString().slice(0,10),$=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];$('#date').textContent=date.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});let store;try{store=JSON.parse(localStorage.getItem(KEY))||{days:{},posts:[]}}catch{store={days:{},posts:[]}}const log=()=>store.days[today()]||(store.days[today()]={meals:[],steps:0,water:0,weight:'',waist:'',note:''}),save=()=>localStorage.setItem(KEY,JSON.stringify(store)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),calories=()=>log().meals.reduce((n,m)=>n+(+m.calories||0),0),toast=m=>{let t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)};const closeDrawer=()=>{$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')};const chart=()=>Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toISOString().slice(0,10),n=+(store.days[key]?.steps||0);return `<div class="day"><div class="track"><div class="bar ${i===6?'today':''}" style="height:${Math.max(5,Math.min(100,n/100))}%"></div></div><span>${d.toLocaleDateString(undefined,{weekday:'short'})}</span></div>`}).join('');const stat=(n,v,u,foot)=>`<article class="stat"><label>${n}</label><strong>${v}</strong><small>${u} · ${foot}</small></article>`;
const home=()=>`<div class="hello"><div><p class="eyebrow">${date.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} ✨</p><h1>Welcome back!</h1><p class="sub">Let’s make room for one small win today.</p></div><button class="btn" data-action="add">＋ Add today's update</button></div><section class="hero"><div><small>A FRESH START, EVERY DAY</small><h2>You don't have to be perfect.<br>Just keep showing up.</h2><p>Track your little wins. Celebrate where you are.</p><button class="btn" data-page="diary">Let's log today →</button></div></section><div class="stats">${stat('Steps walked',(+log().steps).toLocaleString(),'steps',`${Math.max(0,8000-log().steps).toLocaleString()} to your goal`)}${stat('Food today',calories(),'kcal',`${log().meals.length} meals logged`)}${stat('Water',log().water,'glasses','Hydration check-in')}${stat('Weight',log().weight||'—','kg',log().weight?'Logged today':'Your pace, your way')}</div><div class="head"><h2>Your week, one step at a time</h2><button class="link" data-page="progress">See your progress →</button></div><div class="two"><section class="card"><h3>Steps walked</h3><p class="muted">A little movement goes a long way</p><div class="week">${chart()}</div></section><section class="card"><h3>Water check-in</h3><p class="muted">Small sips, big difference</p><div class="water"><strong>${log().water}</strong><span class="muted">glasses today</span><button class="btn soft" data-action="water">＋ Add a glass</button></div><div class="drops">${Array.from({length:8},(_,i)=>`<i class="drop ${i<log().water?'on':''}"></i>`).join('')}</div></section></div><div class="head"><h2>Where would you like to start?</h2></div><div class="quick"><button data-page="diary"><b>♡　Log a meal</b><small>Add food & a photo</small></button><button data-page="diary"><b>⌁　Track your steps</b><small>Celebrate the movement</small></button><button data-page="recipes"><b>♧　Find a new favorite</b><small>Browse healthy recipes</small></button></div>`;
const diary=()=>`<div class="title"><h1>My diary</h1><p>Your daily check-in, all in one gentle place.</p></div><section class="card"><h3>Today's activity</h3><p class="muted">Add the numbers that feel useful for you.</p><form id="daily" class="fields"><div class="field"><label for="steps">Steps walked</label><input id="steps" type="number" min="0" value="${log().steps||''}" placeholder="e.g. 6500"></div><div class="field"><label for="waterInput">Water (glasses)</label><input id="waterInput" type="number" min="0" max="40" value="${log().water||0}"></div><div class="field"><label for="weight">Weight (kg), optional</label><input id="weight" type="number" min="0" step=".1" value="${esc(log().weight)}"></div><div class="field"><label for="waist">Waist (cm), optional</label><input id="waist" type="number" min="0" step=".1" value="${esc(log().waist)}"></div><div class="field full"><label for="note">A note to yourself</label><textarea id="note">${esc(log().note)}</textarea></div><div class="field full"><button class="btn">Save today's activity</button></div></form></section><div class="head"><h2>Food today</h2><span class="muted">${calories()} kcal total</span><button class="btn" data-action="add">＋ Add meal</button></div><div class="meal-list">${log().meals.length?log().meals.map((m,i)=>`<article class="meal">${m.photo?`<img src="${m.photo}" alt="${esc(m.name)}">`:'<div class="food-icon">🥗</div>'}<div class="meal-copy"><b>${esc(m.name)}</b><small>${esc(m.type)}</small></div><b>${+m.calories||0} kcal</b><button class="delete" data-delete="${i}" aria-label="Remove meal">×</button></article>`).join(''):'<section class="card muted">No meals logged yet. Add your first meal when you’re ready.</section>'}</div>`;
const progress=()=>{let days=Object.entries(store.days).sort(([a],[b])=>a.localeCompare(b)).slice(-7),steps=days.reduce((n,[,d])=>n+(+d.steps||0),0),meals=days.reduce((n,[,d])=>n+(d.meals||[]).length,0),water=days.reduce((n,[,d])=>n+(+d.water||0),0);return `<div class="title"><h1>Your progress</h1><p>Small wins count. Here's your last seven logged days.</p></div><div class="progress"><article>Steps this week<b>${steps.toLocaleString()}</b></article><article>Meals logged<b>${meals}</b></article><article>Water glasses<b>${water}</b></article></div><div class="head"><h2>Daily steps</h2></div><section class="card"><div class="week">${chart()}</div></section><div class="head"><h2>Today's recap</h2></div><section class="card"><p><b>${log().steps||0}</b> steps · <b>${log().meals.length}</b> meals · <b>${log().water}</b> glasses · <b>${log().weight||'—'}</b> kg</p><p class="muted">${esc(log().note||'Every check-in is a win. Keep showing up for yourself.')}</p></section>`};
const recipeBases=['Berry oats','Avocado egg','Apple cinnamon','Greek yogurt','Spinach feta','Mango chia','Banana oat','Peanut butter','Garden chickpea','Lemon chicken'];const recipeStyles=['Breakfast bowl','Quick toast','Fresh salad','Warm grain bowl','Veggie wrap','One-pot soup','Roasted tray bake','Simple pasta','Colorful rice bowl','Light skillet'];const recipeNames=recipeBases.flatMap((base,i)=>recipeStyles.map((style,j)=>`${style} with ${base.toLowerCase()}`));const recipes=()=>`<div class="title"><h1>Recipe book</h1><p>Fresh ideas for nourishing your day.</p></div><div class="recipes">${recipeNames.map((n,i)=>`<article class="recipe"><span>${['🥣','🥑','🍓','🥗','🍲'][i%5]}</span><h3>${n}</h3><p>A balanced meal idea with everyday ingredients, vegetables and protein.</p><b class="muted">${[320,410,280,390,450][i%5]} kcal · ${15+i%5*5} min</b></article>`).join('')}</div><p class="muted">Nutrition estimates are for general inspiration.</p>`;
const community=()=>`<div class="title"><h1>What we did</h1><p>Share a meal or a small win with your community.</p></div><section class="card"><h3>Share a daily win</h3><p class="muted">Only share what you're comfortable making visible.</p><div class="field"><label for="shareText">Your caption</label><textarea id="shareText" placeholder="A walk, a meal, or any little win…"></textarea></div><button class="btn" data-action="share" style="margin-top:12px">Share today's win</button></section><div class="head"><h2>Community feed</h2></div><div class="feed">${store.posts.slice().reverse().map(p=>`<article class="post"><div class="post-head"><span class="brand i">✳</span><b>Your wellness journey</b></div><div class="caption">${esc(p.text)} <span class="muted">♡ shared by choice</span></div></article>`).join('')||'<section class="card muted">Your community feed is ready for shared moments. Share your first win above.</section>'}</div>`;
const pages={home,diary,progress,recipes,community};function render(page=location.hash.slice(1)||'home'){if(!pages[page])page='home';$('#view').innerHTML=pages[page]();$('#crumb').textContent=({home:'Home',diary:'My diary',progress:'Progress',recipes:'Recipe book',community:'What we did'})[page];all('[data-page]').forEach(b=>{let yes=b.dataset.page===page;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});save()}function go(page){history.replaceState(null,'',`#${page}`);render(page);closeDrawer();scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{if(e.target.closest('#menu')){if($('#sidebar').classList.contains('open'))closeDrawer();else{$('#sidebar').classList.add('open');$('#backdrop').classList.add('open');$('#menu').setAttribute('aria-expanded','true')}return}if(e.target.closest('#backdrop,[data-close]')){closeDrawer();return}let nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}if(e.target.closest('[data-action="add"]')){$('#mealDialog').showModal();return}if(e.target.closest('[data-dialog-close]')){$('#mealDialog').close();return}if(e.target.closest('#settings')){toast('Your diary is saved privately in this browser.');return}if(e.target.closest('[data-action="water"]')){log().water=Math.min(40,+log().water+1);save();render(location.hash.slice(1)||'home');toast('A glass of water added 💧');return}let del=e.target.closest('[data-delete]');if(del){log().meals.splice(+del.dataset.delete,1);save();render('diary');toast('Meal removed');return}if(e.target.closest('[data-action="share"]')){let text=$('#shareText').value.trim();if(!text){toast('Add a caption first.');return}store.posts.push({text,date:new Date().toISOString()});save();render('community');toast('Your win was added to the feed')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.addEventListener('submit',async e=>{if(e.target.id==='daily'){e.preventDefault();log().steps=+$('#steps').value||0;log().water=Math.min(40,+$('#waterInput').value||0);log().weight=$('#weight').value;log().waist=$('#waist').value;log().note=$('#note').value.trim();save();render('diary');toast('Today’s activity saved')}if(e.target.id==='mealForm'){e.preventDefault();let f=$('#photo').files[0],photo='';if(f){if(f.size>2e6){toast('Please choose a photo under 2 MB.');return}photo=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}log().meals.push({name:$('#mealName').value.trim(),type:$('#mealType').value,calories:+$('#calories').value||0,photo});save();$('#mealDialog').close();e.target.reset();render('diary');toast('Meal added to your diary ♡')}});render()})();
</script></body></html>
